services:
  - type: web
    name: tantsaha-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET_KEY
        value: TANTSAHA_ADMIN_2024
      - key: OPENWEATHER_API_KEY
        sync: false